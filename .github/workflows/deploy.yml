name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许在 GitHub 页面上手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive # 拉取 themes/FixIt
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.166.0"
          extended: true

      - name: Setup Dart Sass
        # FixIt 的 SCSS 需要 Dart Sass（Hugo 0.166 不再内置 Sass 编译器）
        run: |
          curl -fsSL -o /tmp/dart-sass.tar.gz \
            https://github.com/sass/dart-sass/releases/download/1.104.0/dart-sass-1.104.0-linux-x64.tar.gz
          tar -xzf /tmp/dart-sass.tar.gz -C /tmp
          echo "/tmp/dart-sass" >> "$GITHUB_PATH"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: |
          owner="${GITHUB_REPOSITORY_OWNER}"
          repo="${GITHUB_REPOSITORY#*/}"
          # 兼容两种仓库：用户名.github.io（根路径）和普通仓库名（子路径）
          if [ "$repo" = "${owner}.github.io" ]; then
            base="https://${owner}.github.io/"
          else
            base="https://${owner}.github.io/${repo}/"
          fi
          echo "baseURL = $base"
          hugo --minify --baseURL "$base"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
