# -- 站点基础配置 --
# FixIt 主题文档：https://fixit.lruihao.cn/zh-cn/
theme = "FixIt"
title = "我的博客"
baseURL = "https://example.com/" # 占位即可：GitHub Actions 构建时会自动替换成真实地址
defaultContentLanguage = "zh-cn"
locale = "zh-CN"
hasCJKLanguage = true # 让中文的摘要/字数统计正确
timeZone = "Asia/Shanghai"

enableRobotsTXT = true
enableEmoji = true
enableGitInfo = true # 文章最后修改时间可使用 git 记录
summaryLength = 0

buildDrafts = false
buildFuture = false # 注意：文章 date 在未来时不会发布

titleCaseStyle = "ap"
capitalizeListTitles = false
mainSections = ["post"] # 博客文章所在目录 content/post/
