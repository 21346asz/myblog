# -- 主题外观与功能参数 --
# 完整参数见 https://fixit.lruihao.cn/zh-cn/docs/getting-started/configuration/params/
# 未写出的参数沿用主题默认值（默认值定义在 themes/FixIt/hugo.toml）

description = "记录、思考与分享" # 站点描述（SEO / 社交分享摘要）
keywords = ["博客", "技术", "生活"]
default_theme = "auto" # 明暗主题：light / dark / auto
date_format = "2006-01-02"

# 作者信息
[author]
  name = "wArn"
  link = "https://github.com/你的用户名" # 改成你自己的 GitHub 主页
  # avatar = "img/avatar.png" # 作者头像（图片放 assets/img/）

# 顶栏标题与副标题
[header.title]
  # name 留空则自动显示站点标题
[header.subtitle]
  name = "记录、思考与分享"

# 首页作者卡片
[home.profile]
  enable = true
  title = "wArn"
  subtitle = "写写技术，记记生活。"
  typeit = true # 副标题打字机动画
  social = true # 显示社交链接

# 首页文章列表
[home.posts]
  paginate = 10 # 每页显示的文章数

# 页脚
[footer]
  since = "2026"

# 搜索（本地全文搜索，FixIt 默认已开启，这里显式声明）
[search]
  enable = true
  type = "fuse"

# 社交链接（显示在首页作者卡片）
[social]
  GitHub = "https://github.com/你的用户名" # 改成你自己的 GitHub 主页
  RSS = true
