# -- 主题外观与功能参数 --
# 完整参数见 https://fixit.lruihao.cn/zh-cn/docs/getting-started/configuration/params/
# 未写出的参数沿用主题默认值（默认值定义在 themes/FixIt/hugo.toml）

description = "记录、思考与分享" # 站点描述（SEO / 社交分享摘要）
keywords = ["博客", "技术", "生活"]
default_theme = "auto" # 明暗主题：light / dark / auto
date_format = "2006-01-02"

# 作者信息
[author]
  name = "wArn"
  link = "https://github.com/21346asz"
  avatar = "img/avatar.png" # 作者头像（图片放 assets/img/）

# 顶栏标题与副标题
[header.title]
  # name 留空则自动显示站点标题
[header.subtitle]
  name = "记录、思考与分享"

# 首页作者卡片
[home.profile]
  enable = true
  title = "wArn"
  subtitle = "写写技术，记记生活。"
  typeit = true # 副标题打字机动画
  social = true # 显示社交链接

# 首页文章列表
[home.posts]
  paginate = 10 # 每页显示的文章数

# 页脚
[footer]
  since = "2026"

# 搜索（本地全文搜索，FixIt 默认已开启，这里显式声明）
[search]
  enable = true
  type = "fuse"

# 社交链接（显示在首页作者卡片）
[social]
  GitHub = "https://github.com/21346asz"
  RSS = true

# 自定义 partial 注入点（FixIt 官方扩展机制）
# 把站点自有样式片段注入 <head>：文件是 layouts/_partials/custom-style.html
# 目前内含「窄桌面顶栏 680–899.9px 适配」补丁，原因见该文件顶部注释
# 注意：params.toml 里的键本身就是 params 的内容，所以这里写 [custom_partials]，
# 不要再写成 [params.custom_partials]（那样会变成 params.params.… 而失效）
[custom_partials]
  head = ["custom-style"]

# 配色主题：青绿（清爽）
# 覆盖主题默认 SCSS 变量；颜色须用十六进制或 CSS 函数（如 rgba）
[appearance]
  # ===== 字号（★ 想整体放大/缩小，只改 global_font_size 一个值）=====
  # 站点基准字号：正文 1rem 就是它；标题、代码、目录、元信息等都用 rem/em，
  # 会跟着它等比缩放，所以改这一个值 = 全站字号一起变大变小。
  # 参考：16px（主题默认，偏小）· 17px（略大）· 18px（当前，明显更舒服）· 20px（很大）
  global_font_size = "18px"
  # 行高：1.5rem = 正文 1.5 倍行距；跟着基准字号等比走，通常不用动
  global_line_height = "1.5rem"

  # 正文链接
  global_link_color = "#0b6e63"
  global_link_color_dark = "#5fd3c4"
  global_link_hover_color = "#12a594"
  global_link_hover_color_dark = "#9ff0e4"
  # 顶栏当前菜单高亮
  menu_active_color = "#0e9f8e"
  menu_active_color_dark = "#5fd3c4"
  # 文字选中背景
  selection_color = "rgba(18, 165, 148, 0.25)"
  selection_color_dark = "rgba(18, 165, 148, 0.4)"
  # 顶栏背景（淡淡的青色调）
  header_background_color = "#f2faf8"
  header_background_color_dark = "#14201e"
  # 分隔线 / 边框
  global_border_color = "#d3e8e4"
  global_border_color_dark = "#2c3b39"
  # 滚动条
  scrollbar_color = "#8ec9c0"
  scrollbar_hover_color = "#0e9f8e"
