<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0">
<iframe id="f" src="/" style="width:1000px;height:700px;border:0"></iframe>
<pre id="log">pending</pre>
<script>
const f=document.getElementById('f');
f.addEventListener('load',()=>{
 const d=f.contentDocument, out=[];
 const sub=d.querySelector('.home-subtitle');
 out.push('subtitle HTML: '+sub.outerHTML.replace(/\s+/g,' '));
 const cs=getComputedStyle(sub);
 out.push('subtitle font-size='+cs.fontSize+' weight='+cs.fontWeight+' color='+cs.color+' ls='+cs.letterSpacing);
 const ti=sub.querySelector('.typeit');
 if(ti){const t=getComputedStyle(ti);
   out.push('typeit font-size='+t.fontSize+' color='+t.color+' bg='+t.backgroundColor+' padding='+t.padding);
   out.push('ti children: '+[...ti.children].map(c=>c.tagName+'.'+c.className).join(','));
 }
 const cur=d.querySelector('.ti-cursor');
 if(cur){const c=getComputedStyle(cur);out.push('cursor: '+cur.outerHTML+' color='+c.color+' fs='+c.fontSize+' pos='+c.position);}
 else out.push('no .ti-cursor yet');
 const h1=d.querySelector('.home-title');
 const h1s=getComputedStyle(h1);
 out.push('title: size='+h1s.fontSize+' weight='+h1s.fontWeight+' ls='+h1s.letterSpacing+' mb='+h1s.marginBottom);
 document.getElementById('log').textContent=out.join('\n');
});
</script></body></html>
